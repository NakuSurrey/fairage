# FairAge — Nginx reverse proxy snippet.
#
# add this block inside the existing server { ... } on port 80 on the
# Hetzner box. the existing Nginx is already running and fronting other
# projects; FairAge slots into the same instance with two new path prefixes.
#
# routing:
#   public                                 ->  internal
#   http://<server>/fairage-api/...        ->  127.0.0.1:8003
#   http://<server>/fairage-demo/          ->  127.0.0.1:8503 (Streamlit)
#
# why path-based and not subdomain:
#   - no DNS work needed
#   - existing Hetzner setup already uses path prefixes for other projects
#   - 127.0.0.1 binding for both services means defense in depth — a
#     direct attack on port 8003 or 8503 from the internet cannot land
#
# upgrading to HTTPS later:
#   1. install certbot:  sudo apt install certbot python3-certbot-nginx
#   2. point a domain at the Hetzner IP (DuckDNS works free, custom .dev/.io is ~£15/yr)
#   3. run:              sudo certbot --nginx -d fairage.example.com
#   4. certbot auto-edits this config to add the listen 443 ssl block and
#      certificate paths. no FairAge code changes.
#
# install on Hetzner:
#   1. copy this snippet into /etc/nginx/sites-available/default inside
#      the existing server { } block (or its own .conf in conf.d/)
#   2. sudo nginx -t       # syntax check, must say "ok" + "test successful"
#   3. sudo systemctl reload nginx

# ---- /fairage-api -> FastAPI on port 8003 ----
location /fairage-api/ {
    # strip the /fairage-api prefix before forwarding so the FastAPI app
    # sees the original paths it knows (/health, /estimate-age, etc.)
    proxy_pass http://127.0.0.1:8003/;

    # standard reverse-proxy headers — keeps the upstream aware of the
    # original request host, IP, and protocol
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /fairage-api;

    # inference endpoints can take 1-2 seconds (saliency endpoint runs
    # ~144 forward passes). cap the wait at 60s — anything longer is
    # almost certainly a hung request, not a slow legitimate one.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;

    # 10 MB matches the API's MAX_UPLOAD_BYTES. nginx default is 1 MB,
    # which would block normal photo uploads with a 413 before they
    # even reach FastAPI.
    client_max_body_size 10M;
}

# ---- /fairage-demo -> Streamlit on port 8503 ----
location /fairage-demo/ {
    proxy_pass http://127.0.0.1:8503/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamlit uses websockets for live updates of the UI. http_version
    # 1.1 plus the Upgrade headers turn this location into a websocket-aware
    # reverse proxy. without these the page loads but nothing in it updates.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Streamlit's websocket can stay open indefinitely while the user
    # interacts. extend the read timeout so the connection is not killed
    # mid-session.
    proxy_read_timeout 86400s;
}
